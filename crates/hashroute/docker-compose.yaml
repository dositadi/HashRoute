services:
  app:
    build: .
    environment:
      HOST: ${HOST}
      PORT: ${PORT}

    expose:
      - 8080

    ports:
      - 8080:8080
    
    depends_on:
      db:
        condition: "service_healthy"
    
  db:
    container_name: hash_database
    image: postgres:18.6-trixie

    restart: always
    environment:
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      POSTGRES_USER: ${PG_USER}
      POSTGRES_DB: ${PG_DB}

    expose:
      - ${PG_PORT}
    
    ports:
      - ${PG_PORT}:5432

    volumes:
      - hashVolume:/var/lib/postgresql/18/docker
    
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER} -d ${PG_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  hashVolume:
    driver: local
    
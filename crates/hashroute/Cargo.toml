[package]
name = "hashroute"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
dotenvy = "0.15.7"
envconfig = "0.11.1"
tokio = { version = "1.53.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = [
    "std",
    "env-filter",
    "fmt",
    "registry",
    "json",
] }

[[bin]]
name = "app"
path = "src/bin/app.rs"

[lints]
workspace = true

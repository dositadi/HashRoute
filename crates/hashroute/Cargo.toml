[package]
name = "hashroute"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
dotenvy = "0.15.7"
envconfig = "0.11.1"
tokio = { version = "1.53.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = [
    "std",
    "env-filter",
    "fmt",
    "registry",
    "json",
] }
sqlx = { version = "0.9.0", features = [
    "runtime-tokio",
    "tls-native-tls",
    "postgres",
    "migrate",
    "uuid",
    "time",
    "macros",
] }
chrono = "0.4.45"
time = { version = "0.3.55", features = ["serde"] }
validator = { version = "0.20", features = ["derive"] }

serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
axum-extra = { version = "0.12.6", features = ["typed-header"] }
jsonwebtoken = "11.1.0"
argon2 = "0.6.0"
rand_core = "0.10.0"
regex = "1.13.1"
axum-valid = "0.25.0"
uuid = {version = "1.29.0", features = ["serde"]}

[[bin]]
name = "app"
path = "src/bin/app.rs"

[lints]
workspace = true

services:
  app:
    container_name: hashroute_app
    build:
      dockerfile: Dockerfile
    env_file:
      - .env
    volumes:
      - .:/hash_route
      - cargo_target:/hash_route/target
    depends_on: 
      db: 
        condition: service_healthy

  db:
    container_name: hashroute_db
    image: postgres:18.6-alpine3.24
    environment:
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      POSTGRES_USER: ${PG_USER}
      POSTGRES_DB: ${PG_DB}
    expose:
      - 5431
    ports:
      - "5431:5432"
    volumes:
      - hashdb:/var/lib/postgresql/18/docker
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER} -d ${PG_DB}"]
      interval: 3s
      timeout: 5s
      retries: 5
    
volumes:
  hashdb:
    driver: local
  cargo_target:
  